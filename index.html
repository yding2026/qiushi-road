<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8b1e23">
  <title>求是路 · 一名新生走过的一百三十年</title>
  <meta name="description" content="浙江大学建校一百三十周年互动网页。一名新生从求是书院走到启真湖边，为自己的四年选定一件要做的事。">
  <style>
    :root {
      --paper: #f3efe6;
      --card: #fffcf7;
      --ink: #1b1916;
      --blue: #8b1e23;
      --blue-soft: #f8ebe8;
      --bronze: #8a6232;
      --line: #ddd4c4;
      --quiet: #5c564c;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(1200px 500px at 50% -10%, #fff 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: "Songti SC", "STSong", "SimSun", "PMingLiU", serif;
      font-size: 20px;
      line-height: 1.8;
    }

    button, input, textarea { font: inherit; color: inherit; }

    button { cursor: pointer; }

    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 18px auto 28px;
      padding: 26px 22px 48px;
      background: #f7f3ea;
      border: 2px solid var(--blue);
      box-shadow: 0 0 0 7px #f3efe6, 0 0 0 8px var(--bronze);
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--blue);
    }

    .years {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0.08em;
      color: var(--bronze);
    }

    .steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      font-size: 20px;
    }

    .steps li { color: var(--quiet); }

    .steps li.now { color: var(--blue); font-weight: 700; }

    .steps li.done { color: var(--ink); }

    .scene { margin-top: 28px; }

    .art { margin: 8px 0 18px; color: var(--blue); }

    .art svg { width: 100%; height: auto; display: block; }

    .kicker {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: 0.16em;
      color: var(--bronze);
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.06em;
    }

    .prose p { margin: 0 0 14px; }

    .ask {
      margin: 22px 0 12px;
      font-weight: 700;
    }

    .choices, .stack { display: grid; gap: 12px; }

    .choice, .ghost, .primary, .place, .school {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px 16px;
      min-height: 52px;
    }

    .choice:hover, .school:hover, .place:hover, .ghost:hover {
      border-color: var(--blue);
    }

    .choice.on { border-color: var(--blue); background: var(--blue-soft); }

    .choice strong, .school strong { display: block; font-weight: 700; }

    .choice span, .school span {
      display: block;
      margin-top: 4px;
      font-size: 20px;
      line-height: 1.6;
      color: var(--ink);
    }

    .primary {
      text-align: center;
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      font-weight: 700;
    }

    .primary:disabled {
      background: #c4a6a6;
      border-color: #c4a6a6;
      cursor: not-allowed;
    }

    .school.on, .place.on { border-color: var(--blue); background: var(--blue-soft); }

    .school.ok, .place.ok {
      border-color: var(--blue);
      background: var(--card);
      color: var(--blue);
    }

    .match {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .note {
      min-height: 1.75em;
      margin: 12px 0;
    }

    .hint { color: var(--bronze); }

    label { display: block; font-weight: 700; margin-bottom: 8px; }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 20px;
    }

    textarea { min-height: 96px; resize: vertical; }

    .count { margin: 8px 0 16px; font-size: 20px; color: var(--ink); }

    .count.over { color: var(--bronze); font-weight: 700; }

    .card {
      background: var(--card);
      border: 1px solid var(--blue);
      padding: 28px 22px 22px;
    }

    .card h2 { margin-bottom: 4px; }

    .card .who {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .card dl { margin: 0; }

    .card dt {
      margin-top: 14px;
      font-size: 20px;
      color: var(--bronze);
    }

    .card dd { margin: 2px 0 0; }

    .card .seal {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--blue);
      letter-spacing: 0.06em;
    }

    .foot {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 20px;
    }

    .foot button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .pairs { margin: 8px 0 0; padding: 0; list-style: none; }

    .pairs li { padding: 4px 0; }

    .ack {
      padding: 14px 16px;
      background: var(--blue-soft);
      border-left: 3px solid var(--blue);
    }

    body.modal-open { overflow: hidden; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .modal-mask {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      min-height: 0;
      background: rgba(27, 25, 22, 0.48);
      cursor: pointer;
    }

    .modal-box {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      max-height: min(78dvh, 680px);
      overflow: auto;
      padding: 28px 24px 22px;
      background: var(--card);
      border: 2px solid var(--blue);
      box-shadow: 0 0 0 7px rgba(243, 239, 230, 0.94), 0 18px 40px rgba(27, 25, 22, 0.2);
      animation: modal-rise 0.28s ease;
    }

    .modal-box .prose p:last-child { margin-bottom: 0; }

    .modal-extra {
      margin-top: 12px;
      padding: 12px 14px;
      background: var(--paper);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .modal-actions { margin-top: 18px; }

    @keyframes modal-rise {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .modal-box { animation: none; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(720px, calc(100% - 24px)); }
      h2 { font-size: 30px; }
      .match { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="brand">求是路</p>
      <p class="years">1897—2027</p>
    </header>
    <div id="app"></div>
  </div>

  <script>
    // 场景、选项和校史句子都集中在这里，方便通读。
    const STEPS = [
      { id: "zijin", label: "报到" },
      { id: "academy", label: "书院" },
      { id: "west", label: "西迁" },
      { id: "merger", label: "四校" },
      { id: "hall", label: "讲堂" },
      { id: "promise", label: "四年" },
      { id: "wish", label: "湖边" }
    ];

    const SCHOOLS = [
      { id: "zju", name: "浙江大学", clue: "当时以工科为学校主体", place: "yuquan" },
      { id: "hdu", name: "杭州大学", clue: "文理诸科多集中于此", place: "xixi" },
      { id: "zau", name: "浙江农业大学", clue: "农学在此，园中有一池", place: "huajiachi" },
      { id: "zmu", name: "浙江医科大学", clue: "旧址靠近西湖的东岸", place: "hubin" }
    ];

    const PLACES = [
      { id: "yuquan", name: "玉泉" },
      { id: "xixi", name: "西溪" },
      { id: "huajiachi", name: "华家池" },
      { id: "hubin", name: "湖滨" }
    ];

    const DEFAULT_WISH = "一百三十年求是未止，我愿把小事做到真处。";

    const state = {
      scene: "cover",
      returnTo: "cover",
      name: "",
      attitude: "",
      gate: "",
      pack: "",
      promise: "",
      wish: DEFAULT_WISH,
      selectedSchool: "",
      matched: {},
      placeOrder: [],
      mistakes: 0,
      phase: "ask",
      // 交互之后才出现的话，不写进页面，只放进弹窗。
      modal: null
    };

    const app = document.getElementById("app");

    function esc(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function charCount(text) {
      return Array.from(text || "").length;
    }

    function displayName() {
      const name = state.name.trim();
      return name || "新生";
    }

    function findSchool(id) {
      return SCHOOLS.find((item) => item.id === id);
    }

    function findPlace(id) {
      return PLACES.find((item) => item.id === id);
    }

    function stroke() {
      return 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
    }

    // 线描都是原创简笔，不是校徽标准图，也不是照片。
    function eagleMark(x, y) {
      const p = stroke();
      return `
        <circle ${p} cx="${x}" cy="${y}" r="62"/>
        <path ${p} d="M${x} ${y - 4} C${x - 28} ${y - 36} ${x - 62} ${y - 28} ${x - 58} ${y + 8} C${x - 36} ${y - 6} ${x - 16} ${y - 2} ${x - 2} ${y + 8}"/>
        <path ${p} d="M${x} ${y - 4} C${x + 28} ${y - 36} ${x + 62} ${y - 28} ${x + 58} ${y + 8} C${x + 36} ${y - 6} ${x + 16} ${y - 2} ${x + 2} ${y + 8}"/>
        <path ${p} d="M${x - 8} ${y - 6} H${x + 8} L${x + 12} ${y + 36} L${x} ${y + 50} L${x - 12} ${y + 36} Z"/>
        <path ${p} d="M${x + 6} ${y - 8} C${x + 16} ${y - 22} ${x + 28} ${y - 20} ${x + 30} ${y - 10}"/>
        <path ${p} d="M${x + 30} ${y - 10} L${x + 42} ${y - 12}"/>
        <path ${p} d="M${x - 10} ${y + 50} L${x} ${y + 62} L${x + 10} ${y + 50}"/>
      `;
    }

    function hallMark(x, ground) {
      const p = stroke();
      return `
        <path ${p} d="M${x - 210} ${ground} H${x + 210}"/>
        <path ${p} d="M${x - 180} ${ground} V${ground - 18} H${x + 180} V${ground}"/>
        <path ${p} d="M${x - 150} ${ground - 18} V${ground - 36} H${x + 150} V${ground - 18}"/>
        <path ${p} d="M${x - 120} ${ground - 36} V${ground - 52} H${x + 120} V${ground - 36}"/>
        <path ${p} d="M${x - 100} ${ground - 52} V${ground - 102} M${x - 55} ${ground - 52} V${ground - 102} M${x - 10} ${ground - 52} V${ground - 102} M${x + 10} ${ground - 52} V${ground - 102} M${x + 55} ${ground - 52} V${ground - 102} M${x + 100} ${ground - 52} V${ground - 102}"/>
        <path ${p} d="M${x - 124} ${ground - 102} H${x + 124}"/>
        <path ${p} d="M${x - 150} ${ground - 102} L${x} ${ground - 156} L${x + 150} ${ground - 102}"/>
        <path ${p} d="M${x - 132} ${ground - 102} L${x} ${ground - 144} L${x + 132} ${ground - 102}"/>
        <path ${p} d="M${x - 150} ${ground - 102} l-14 10 M${x + 150} ${ground - 102} l14 10"/>
        <path ${p} d="M${x} ${ground - 156} V${ground - 168}"/>
        <path ${p} d="M${x - 18} ${ground - 52} V${ground - 84} H${x + 18} V${ground - 52}"/>
      `;
    }

    function zhuMark(x, y) {
      const p = stroke();
      return `
        <circle ${p} cx="${x}" cy="${y}" r="74"/>
        <path ${p} d="M${x - 24} ${y - 18} Q${x} ${y - 48} ${x + 24} ${y - 18}"/>
        <circle ${p} cx="${x}" cy="${y - 8}" r="24"/>
        <circle ${p} cx="${x - 10}" cy="${y - 6}" r="7"/>
        <circle ${p} cx="${x + 10}" cy="${y - 6}" r="7"/>
        <path ${p} d="M${x - 3} ${y - 6} H${x + 3}"/>
        <path ${p} d="M${x} ${y - 2} V${y + 8}"/>
        <path ${p} d="M${x - 8} ${y + 16} H${x + 8}"/>
        <path ${p} d="M${x - 22} ${y + 8} v8 M${x + 22} ${y + 8} v8"/>
        <path ${p} d="M${x - 12} ${y + 16} V${y + 40} M${x + 12} ${y + 16} V${y + 40}"/>
        <path ${p} d="M${x - 48} ${y + 74} C${x - 28} ${y + 36} ${x + 28} ${y + 36} ${x + 48} ${y + 74}"/>
      `;
    }

    function gateMark(x, ground) {
      const p = stroke();
      return `
        <path ${p} d="M${x - 70} ${ground} V${ground - 78} M${x + 70} ${ground} V${ground - 78}"/>
        <path ${p} d="M${x - 86} ${ground - 78} L${x} ${ground - 118} L${x + 86} ${ground - 78}"/>
        <path ${p} d="M${x - 74} ${ground - 62} L${x} ${ground - 96} L${x + 74} ${ground - 62}"/>
        <path ${p} d="M${x - 40} ${ground - 48} H${x + 40} V${ground - 18} H${x - 40} Z"/>
        <path ${p} d="M${x - 96} ${ground} H${x + 96}"/>
      `;
    }

    function art(kind) {
      const pictures = {
        cover: `<svg role="img" aria-label="求是鹰与求是大讲堂线描" viewBox="0 0 640 230">${eagleMark(108, 118)}${hallMark(410, 204)}</svg>`,
        hall: `<svg role="img" aria-label="求是大讲堂线描" viewBox="0 0 640 230">${hallMark(320, 206)}</svg>`,
        gate: `<svg role="img" aria-label="求是书院牌坊线描" viewBox="0 0 640 210">${gateMark(320, 186)}</svg>`,
        west: `<svg role="img" aria-label="竺可桢校长线描" viewBox="0 0 640 220">${zhuMark(250, 104)}<path ${stroke()} d="M40 190 H600"/><path ${stroke()} d="M470 190 V128 H500 V190"/><path ${stroke()} d="M464 128 H506 L494 150 H476 Z"/></svg>`,
        doors: `<svg role="img" aria-label="四座校园门线描" viewBox="0 0 640 330">${gateMark(160, 145)}${gateMark(480, 145)}${gateMark(160, 310)}${gateMark(480, 310)}</svg>`,
        hallzhu: `<svg role="img" aria-label="竺可桢校长与求是大讲堂线描" viewBox="0 0 640 250">${zhuMark(120, 120)}${hallMark(430, 220)}</svg>`,
        lakeside: `<svg role="img" aria-label="求是大讲堂与启真湖线描" viewBox="0 0 640 240">${hallMark(320, 168)}<ellipse ${stroke()} cx="320" cy="206" rx="150" ry="16"/></svg>`
      };
      return `<div class="art">${pictures[kind] || ""}</div>`;
    }

    function stepsHtml() {
      if (state.scene === "cover" || state.scene === "about") return "";
      const order = STEPS.map((item) => item.id);
      const here = order.indexOf(state.scene);
      const items = STEPS.map((item, index) => {
        let cls = "";
        if (state.scene === "card" || index < here) cls = "done";
        if (item.id === state.scene) cls = "now";
        return `<li class="${cls}">${item.label}</li>`;
      }).join("");
      return `<ol class="steps">${items}</ol>`;
    }

    function footHtml() {
      const about = state.scene === "about"
        ? ""
        : `<button type="button" data-act="about">阅读创作说明</button>`;
      const back = ["cover", "card", "about"].includes(state.scene)
        ? ""
        : `<p><button type="button" data-act="back-step">上一步</button></p>`;
      return `<div class="foot">${back}<p>浙江大学「素养」课传播实践 · 创意类网页游戏</p><p>校史依据学校公开记载。文案与交互由人工智能辅助写成，线描则是原创简笔，并非校徽原图。${about}</p></div>`;
    }

    function choiceButtons(group, list) {
      return `<div class="choices">${list.map((item) => {
        const on = state.phase === "ack" && state[group] === item.id ? " on" : "";
        return `<button type="button" class="choice${on}" data-act="choose" data-group="${group}" data-id="${esc(item.id)}"><strong>${esc(item.title)}</strong></button>`;
      }).join("")}</div>`;
    }

    // 选完之后要说的话。句长尽量居中，让校史像故事一样往下讲。
    function responseOf(group, id) {
      const book = {
        attitude: {
          road: {
            kicker: "去书院门前",
            paragraphs: ["既想把这所学校的来路问清楚，我们便从1897年的书院门前走起。"]
          },
          steady: {
            kicker: "去书院门前",
            paragraphs: ["日子自然要安顿，来路也该知道，我们便先走到书院门前，再回头料理自己的课业。"]
          },
          make: {
            kicker: "去书院门前",
            paragraphs: ["也好，先看看前人是怎样把一件事情做成的，再来决定你这四年要做什么。"]
          }
        },
        gate: {
          right: {
            kicker: "门边的一句",
            paragraphs: ["你留在门边的是「只问是非，不计利害」。竺可桢后来解释求是，也曾说过要只问是非、不计利害。"]
          },
          solid: {
            kicker: "门边的一句",
            paragraphs: ["你留在门边的是把事情做实，而求是书院从开办那天起，就把讲求实学放在最前面。"]
          },
          use: {
            kicker: "门边的一句",
            paragraphs: ["你留在门边的是学了要有用，因为求是不能只停在纸面上，到头来还是要落到做事上。"]
          }
        },
        pack: {
          tool: {
            kicker: "行囊里",
            paragraphs: ["你想守住的是仪器，而图书和仪器当年都跟着学校西迁，研究因此没有停下来。"]
          },
          people: {
            kicker: "行囊里",
            paragraphs: ["你想守住的是人，课之所以还能留下来，正是因为师生仍在一处。"]
          },
          light: {
            kicker: "行囊里",
            paragraphs: ["你想守住的是还能上课的那一点光，学校每到一处，都会重新把课开起来。"]
          }
        },
        promise: {
          read: {
            kicker: "四年之约",
            paragraphs: [
              "一门课若要讲给别人听，自己先得把它读明白，这原是求是最基本的功夫。",
              "求是走了一百三十年，靠的是有人把真问题做到底，也靠有人把所学用出去。你的四年，就接在这条路上。"
            ]
          },
          make: {
            kicker: "四年之约",
            paragraphs: [
              "会读书之后，还得学会动手，这一步便是创造的起点。",
              "求是走了一百三十年，靠的是有人把真问题做到底，也靠有人把所学用出去。你的四年，就接在这条路上。"
            ]
          },
          person: {
            kicker: "四年之约",
            paragraphs: [
              "学问若能落到具体的人身上，才算真正有了着落。",
              "求是走了一百三十年，靠的是有人把真问题做到底，也靠有人把所学用出去。你的四年，就接在这条路上。"
            ]
          }
        }
      };
      return (book[group] && book[group][id]) || { kicker: "", paragraphs: [] };
    }

    function mergerSuccessModal() {
      return {
        kicker: "一个名字",
        paragraphs: [
          "四所学校都连上了，合并以后校名仍是浙江大学。当时的校园里有玉泉、西溪、华家池、湖滨，还有之江。",
          "你脚下的紫金港是后来才建起来的，启真湖便在这里。"
        ],
        primaryLabel: "走向求是大讲堂",
        primaryAct: "go",
        primaryId: "hall",
        dismiss: "none"
      };
    }

    function coverHtml() {
      return `
        ${art("cover")}
        <p class="kicker">一名新生走过的一百三十年</p>
        <h2>把这条路走一遍</h2>
        <div class="prose">

    function modalHtml() {
      const m = state.modal;
      if (!m) return "";
      const paras = (m.paragraphs || []).map((p) => `<p>${esc(p)}</p>`).join("");
      const extra = m.extra ? `<p class="modal-extra">${esc(m.extra)}</p>` : "";
      const kicker = m.kicker ? `<p class="kicker">${esc(m.kicker)}</p>` : "";
      const secondary = m.secondaryLabel
        ? `<button type="button" class="ghost" data-act="modal-close">${esc(m.secondaryLabel)}</button>`
        : "";
      const idAttr = m.primaryId ? ` data-id="${esc(m.primaryId)}"` : "";
      const mask = m.dismiss === "none"
        ? `<div class="modal-mask"></div>`
        : `<button type="button" class="modal-mask" data-act="modal-close" aria-label="关闭"></button>`;
      return `
        <div class="modal">
          ${mask}
          <div class="modal-box" role="dialog" aria-modal="true" aria-label="${esc(m.kicker || "提示")}">
            ${kicker}
            <div class="prose">${paras}${extra}</div>
            <div class="stack modal-actions">
              <button type="button" class="primary" data-act="${esc(m.primaryAct)}"${idAttr}>${esc(m.primaryLabel)}</button>
              ${secondary}
            </div>
          </div>
        </div>`;
    }

    function openModal(modal) {
      state.modal = modal;
      render();
    }

    // 关掉弹窗。若是选项后的回应，关掉以后可以重选。
    function dismissModal() {
      if (!state.modal || state.modal.dismiss === "none") return;
      const mode = state.modal.dismiss;
      state.modal = null;
      if (mode === "ask") state.phase = "ask";
      render();
    }

    function render() {
      const body = {
        cover: coverHtml,
        zijin: zijinHtml,
        academy: academyHtml,
        west: westHtml,
        merger: mergerHtml,
        promise: promiseHtml,
        wish: wishHtml,
        hall: hallHtml,
        card: cardHtml,
        about: aboutHtml
      }[state.scene];
      app.innerHTML = `${stepsHtml()}<section class="scene">${body()}</section>${modalHtml()}`;
      document.body.classList.toggle("modal-open", Boolean(state.modal));
      if (state.modal) {
        const btn = app.querySelector(".modal-box .primary");
        if (btn) btn.focus();
        return;
      }
      if (state.scene === "cover") {
        const input = document.getElementById("name");
        if (input) input.focus();
      }
      if (state.scene === "wish") {
        const box = document.getElementById("wish");
        if (box) {
          const end = box.value.length;
          box.setSelectionRange(end, end);
          box.focus();
        }
      }
    }

    function go(scene) {
      if (scene === "merger" && state.placeOrder.length === 0) {
        state.placeOrder = shuffle(PLACES.map((item) => item.id));
        state.matched = {};
        state.selectedSchool = "";
        state.mistakes = 0;
      }
      state.modal = null;
      state.phase = "ask";
      state.scene = scene;
      render();
      window.scrollTo(0, 0);
    }

    function shuffle(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextAfter(group) {
      const map = { attitude: "academy", gate: "west", pack: "merger", promise: "wish" };
      go(map[group]);
    }

    function choose(group, id) {
      state[group] = id;
      state.phase = "ack";
      const copy = responseOf(group, id);
      openModal({
        kicker: copy.kicker,
        paragraphs: copy.paragraphs,
        primaryLabel: group === "promise" ? "走向湖边" : "继续往前",
        primaryAct: "next",
        secondaryLabel: "再想一想",
        dismiss: "ask"
      });
    }

    function pickSchool(id) {
      if (state.matched[id]) return;
      const school = findSchool(id);
      state.selectedSchool = id;
      openModal({
        kicker: school.name,
        paragraphs: [`你的目光先停在${school.name}，接着再去认一认它当时的校园。`],
        primaryLabel: "去点校园",
        primaryAct: "modal-close",
        dismiss: "close"
      });
    }

    function pickPlace(placeId) {
      if (Object.values(state.matched).includes(placeId)) return;
      if (!state.selectedSchool) {
        openModal({
          kicker: "还差一步",
          paragraphs: ["先点左边的一所学校，再去点它当时的校园。"],
          primaryLabel: "知道了",
          primaryAct: "modal-close",
          dismiss: "close"
        });
        return;
      }
      const school = findSchool(state.selectedSchool);
      if (school.place === placeId) {
        state.matched[state.selectedSchool] = placeId;
        state.selectedSchool = "";
        const done = Object.keys(state.matched).length === SCHOOLS.length;
        if (done) {
          openModal(mergerSuccessModal());
          return;
        }
        openModal({
          kicker: "连上了",
          paragraphs: [`${school.name}当时的主要校园，正是${findPlace(placeId).name}。`],
          primaryLabel: "知道了",
          primaryAct: "modal-close",
          dismiss: "close"
        });
        return;
      }
      state.mistakes += 1;
      state.selectedSchool = "";
      const paragraphs = ["这一对还没有对上，不妨再试一次。"];
      if (state.mistakes >= 2) {
        paragraphs.push("若是想不起来，可以记一记：浙江大学在玉泉，杭州大学在西溪；园中有池的是华家池，靠近西湖东岸的是湖滨。");
      }
      openModal({
        kicker: "还没对上",
        paragraphs,
        primaryLabel: "知道了",
        primaryAct: "modal-close",
        dismiss: "close"
      });
    }

    function backStep() {
      const order = ["cover", "zijin", "academy", "west", "merger", "hall", "promise", "wish"];
      const index = order.indexOf(state.scene);
      if (index <= 0) return;
      state.modal = null;
      state.phase = "ask";
      state.scene = order[index - 1];
      render();
      window.scrollTo(0, 0);
    }

    function shareText() {
      const link = location.href.split("#")[0];
      return `我走完了网页游戏《求是路》。一名新生从求是鹰和求是大讲堂出发，走过书院、西迁和四校合并，把自己的一句话送到一百三十周年的前头。2027年5月21日，是浙江大学建校一百三十周年。\n${link}`;
    }

    function wrapText(ctx, text, maxWidth) {
      const chars = Array.from(text);
      const lines = [];
      let line = "";
      chars.forEach((ch) => {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    }

    function downloadCard() {
      const width = 1080;
      const height = 1620;
      const scale = 2;
      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.fillStyle = "#f3efe6";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#8b1e23";
      ctx.lineWidth = 4;
      ctx.strokeRect(48, 48, width - 96, height - 96);
      ctx.fillStyle = "#8b1e23";
      ctx.font = '64px "Songti SC", "SimSun", "Microsoft YaHei", serif';
      ctx.fillText("百卅贺帖", 96, 180);
      ctx.fillStyle = "#8a6232";
      ctx.font = '36px "Microsoft YaHei", sans-serif';
      ctx.fillText("1897—2027", 96, 250);
      const rows = [
        ["出发时", labelOf("attitude", state.attitude)],
        ["书院门边", labelOf("gate", state.gate)],
        ["西迁行囊", labelOf("pack", state.pack)],
        ["四年之约", labelOf("promise", state.promise)],
        ["湖边的一句", state.wish.trim()]
      ];
      let y = 360;
      rows.forEach(([label, value]) => {
        ctx.fillStyle = "#8a6232";
        ctx.font = '36px "Microsoft YaHei", sans-serif';
        ctx.fillText(label, 96, y);
        y += 48;
        ctx.fillStyle = "#1b1916";
        ctx.font = '36px "Microsoft YaHei", sans-serif';
        wrapText(ctx, value, 860).forEach((line) => {
          ctx.fillText(line, 96, y);
          y += 52;
        });
        y += 28;
      });
      ctx.fillStyle = "#8b1e23";
      ctx.font = '32px "Microsoft YaHei", sans-serif';
      ctx.fillText("浙江大学建校一百三十周年", 96, 1480);
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = "求是路-百卅贺帖.png";
      link.click();
    }

    async function copyShare() {
      const text = shareText();
      try {
        await navigator.clipboard.writeText(text);
        openModal({
          kicker: "可以带走",
          paragraphs: ["这几句已经复制好了，贴到小红书上便可以。"],
          primaryLabel: "知道了",
          primaryAct: "modal-close",
          dismiss: "close"
        });
      } catch (error) {
        openModal({
          kicker: "请亲手抄下",
          paragraphs: ["浏览器没有允许自动复制。你可以把下面这段话选中，再自己复制走。"],
          extra: text,
          primaryLabel: "知道了",
          primaryAct: "modal-close",
          dismiss: "close"
        });
      }
    }

    function restart() {
      state.scene = "cover";
      state.attitude = "";
      state.gate = "";
      state.pack = "";
      state.promise = "";
      state.wish = DEFAULT_WISH;
      state.selectedSchool = "";
      state.matched = {};
      state.placeOrder = [];
      state.mistakes = 0;
      state.phase = "ask";
      state.modal = null;
      render();
      window.scrollTo(0, 0);
    }

    app.addEventListener("click", (event) => {
      const el = event.target.closest("[data-act]");
      if (!el || el.disabled) return;
      const act = el.dataset.act;
      const id = el.dataset.id || "";
      if (act === "go") {
        go(id);
        return;
      }
      if (act === "choose") {
        choose(el.dataset.group, id);
        return;
      }
      if (act === "next") {
        const group = state.scene === "zijin" ? "attitude" : state.scene === "academy" ? "gate" : state.scene === "west" ? "pack" : "promise";
        nextAfter(group);
        return;
      }
      if (act === "school") {
        pickSchool(id);
        return;
      }
      if (act === "place") {
        pickPlace(id);
        return;
      }
      if (act === "finish") {
        const box = document.getElementById("wish");
        state.wish = box ? box.value.trim() : state.wish.trim();
        if (charCount(state.wish) === 0 || charCount(state.wish) > 40) return;
        go("card");
        return;
      }
      if (act === "download") {
        downloadCard();
        return;
      }
      if (act === "copy") {
        copyShare();
        return;
      }
      if (act === "modal-close") {
        dismissModal();
        return;
      }
      if (act === "reread-merger") {
        openModal(mergerSuccessModal());
        return;
      }
      if (act === "restart") {
        restart();
        return;
      }
      if (act === "back-step") {
        backStep();
        return;
      }
      if (act === "about") {
        state.returnTo = state.scene === "about" ? state.returnTo : state.scene;
        state.modal = null;
        state.scene = "about";
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (act === "back") {
        state.modal = null;
        state.scene = state.returnTo || "cover";
        render();
        window.scrollTo(0, 0);
      }
    });

    app.addEventListener("input", (event) => {
      if (event.target.id === "name") state.name = event.target.value;
      if (event.target.id === "wish") {
        state.wish = event.target.value;
        const count = charCount(state.wish.trim());
        const node = document.getElementById("wish-count");
        const button = document.getElementById("go-card");
        const over = count > 40 || count === 0;
        if (node) {
          node.textContent = `${count}/40${count > 40 ? "，请改到40字以内" : ""}`;
          node.classList.toggle("over", over);
        }
        if (button) button.disabled = over;
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") dismissModal();
    });

    render();
  </script>
</body>
</html>
