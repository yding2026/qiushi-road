<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b3a75">
  <title>求是路 · 一名新生走过的一百三十年</title>
  <meta name="description" content="浙江大学建校一百三十周年互动网页。一名新生从求是书院走到启真湖，再为这四年选定一件要做的事。">
  <style>
    :root {
      --paper: #f3efe6;
      --card: #fffcf7;
      --ink: #1b1916;
      --blue: #0b3a75;
      --blue-soft: #e6eef7;
      --bronze: #8a6232;
      --line: #ddd4c4;
      --quiet: #5c564c;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(1200px 500px at 50% -10%, #fff 0%, transparent 55%),
        var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 18px;
      line-height: 1.75;
    }

    button, input, textarea { font: inherit; color: inherit; }

    button { cursor: pointer; }

    .wrap {
      width: min(720px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 64px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      margin: 0;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--blue);
    }

    .years {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      color: var(--bronze);
    }

    .steps {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      list-style: none;
      margin: 18px 0 0;
      padding: 0;
      font-size: 16px;
    }

    .steps li { color: var(--quiet); }

    .steps li.now { color: var(--blue); font-weight: 700; }

    .steps li.done { color: var(--ink); }

    .scene { margin-top: 28px; animation: rise 0.45s ease; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene { animation: none; }
    }

    .art { margin: 8px 0 18px; color: var(--blue); }

    .art svg { width: 100%; height: auto; display: block; }

    .kicker {
      margin: 0 0 6px;
      font-size: 16px;
      letter-spacing: 0.16em;
      color: var(--bronze);
    }

    h2 {
      margin: 0 0 16px;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0.06em;
    }

    .prose p { margin: 0 0 14px; }

    .ask {
      margin: 22px 0 12px;
      font-weight: 700;
    }

    .choices, .stack { display: grid; gap: 12px; }

    .choice, .ghost, .primary, .place, .school {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px 16px;
      min-height: 52px;
    }

    .choice:hover, .school:hover, .place:hover, .ghost:hover {
      border-color: var(--blue);
    }

    .choice strong, .school strong { display: block; font-weight: 700; }

    .choice span, .school span {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--quiet);
    }

    .primary {
      text-align: center;
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      font-weight: 700;
    }

    .primary:disabled {
      background: #9aa8bc;
      border-color: #9aa8bc;
      cursor: not-allowed;
    }

    .school.on, .place.on { border-color: var(--blue); background: var(--blue-soft); }

    .school.ok, .place.ok {
      border-color: var(--blue);
      background: var(--card);
      color: var(--blue);
    }

    .match {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    .note {
      min-height: 1.75em;
      margin: 12px 0;
    }

    .hint { color: var(--bronze); }

    label { display: block; font-weight: 700; margin-bottom: 8px; }

    input[type="text"], textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 4px;
      padding: 12px 14px;
      font-size: 18px;
    }

    textarea { min-height: 96px; resize: vertical; }

    .count { margin: 8px 0 16px; font-size: 16px; color: var(--quiet); }

    .count.over { color: var(--bronze); font-weight: 700; }

    .card {
      background: var(--card);
      border: 1px solid var(--blue);
      padding: 28px 22px 22px;
    }

    .card h2 { margin-bottom: 4px; }

    .card .who {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .card dl { margin: 0; }

    .card dt {
      margin-top: 14px;
      font-size: 16px;
      color: var(--bronze);
    }

    .card dd { margin: 2px 0 0; }

    .card .seal {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--blue);
      letter-spacing: 0.06em;
    }

    .foot {
      margin-top: 28px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 16px;
    }

    .foot button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--blue);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .pairs { margin: 8px 0 0; padding: 0; list-style: none; }

    .pairs li { padding: 4px 0; }

    .ack {
      padding: 14px 16px;
      background: var(--blue-soft);
      border-left: 3px solid var(--blue);
    }

    @media (max-width: 640px) {
      .wrap { width: min(720px, calc(100% - 24px)); }
      h2 { font-size: 30px; }
      .match { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <p class="brand">求是路</p>
      <p class="years">1897—2027</p>
    </header>
    <div id="app"></div>
  </div>

  <script>
    // 场景、选项和校史句子都集中在这里，方便通读。
    const STEPS = [
      { id: "zijin", label: "报到" },
      { id: "academy", label: "书院" },
      { id: "west", label: "西迁" },
      { id: "merger", label: "四校" },
      { id: "promise", label: "四年" },
      { id: "wish", label: "湖边" }
    ];

    const SCHOOLS = [
      { id: "zju", name: "浙江大学", clue: "当时以工科为主体", place: "yuquan" },
      { id: "hdu", name: "杭州大学", clue: "文理学科集中于此", place: "xixi" },
      { id: "zau", name: "浙江农业大学", clue: "农学在此，园中有池", place: "huajiachi" },
      { id: "zmu", name: "浙江医科大学", clue: "旧址靠近西湖东岸", place: "hubin" }
    ];

    const PLACES = [
      { id: "yuquan", name: "玉泉" },
      { id: "xixi", name: "西溪" },
      { id: "huajiachi", name: "华家池" },
      { id: "hubin", name: "湖滨" }
    ];

    const DEFAULT_WISH = "一百三十年求是不止，我愿把小事做真。";

    const state = {
      scene: "cover",
      returnTo: "cover",
      name: "",
      attitude: "",
      gate: "",
      pack: "",
      promise: "",
      wish: DEFAULT_WISH,
      selectedSchool: "",
      matched: {},
      placeOrder: [],
      mistakes: 0,
      feedback: "",
      phase: "ask"
    };

    const app = document.getElementById("app");

    function esc(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function charCount(text) {
      return Array.from(text || "").length;
    }

    function displayName() {
      const name = state.name.trim();
      return name || "新生";
    }

    function findSchool(id) {
      return SCHOOLS.find((item) => item.id === id);
    }

    function findPlace(id) {
      return PLACES.find((item) => item.id === id);
    }

    function art(kind) {
      const common = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
      const paths = {
        lake: `<svg viewBox="0 0 640 120" aria-hidden="true"><path ${common} d="M20 70c50-24 110-36 180-36 90 0 120 32 210 32 70 0 120-18 190-40"/><ellipse ${common} cx="230" cy="88" rx="86" ry="16"/></svg>`,
        gate: `<svg viewBox="0 0 640 120" aria-hidden="true"><path ${common} d="M150 96V36h340v60"/><path ${common} d="M150 36c60-24 280-24 340 0"/><path ${common} d="M250 96V58h140v38"/><circle ${common} cx="320" cy="28" r="6"/></svg>`,
        lamp: `<svg viewBox="0 0 640 120" aria-hidden="true"><path ${common} d="M40 90h560"/><path ${common} d="M250 90V48h28v42"/><path ${common} d="M246 48h36l-6 16h-24z"/><path ${common} d="M264 64v8"/></svg>`,
        doors: `<svg viewBox="0 0 640 120" aria-hidden="true"><path ${common} d="M70 96V34h90v62M205 96V34h90v62M340 96V34h90v62M475 96V34h90v62"/></svg>`
      };
      return `<div class="art">${paths[kind] || ""}</div>`;
    }

    function stepsHtml() {
      if (state.scene === "cover" || state.scene === "about") return "";
      const order = STEPS.map((item) => item.id);
      const here = order.indexOf(state.scene);
      const items = STEPS.map((item, index) => {
        let cls = "";
        if (state.scene === "card" || index < here) cls = "done";
        if (item.id === state.scene) cls = "now";
        return `<li class="${cls}">${item.label}</li>`;
      }).join("");
      return `<ol class="steps">${items}</ol>`;
    }

    function footHtml() {
      const about = state.scene === "about"
        ? ""
        : `<button type="button" data-act="about">阅读创作说明</button>`;
      const back = ["cover", "card", "about"].includes(state.scene)
        ? ""
        : `<p><button type="button" data-act="back-step">上一步</button></p>`;
      return `<div class="foot">${back}<p>俞丁悦 · 浙江大学「素养」课传播实践 · 创意类网页游戏</p><p>校史依据学校公开记载。文案与交互由人工智能辅助生成。${about}</p></div>`;
    }

    function choiceButtons(group, list) {
      return `<div class="choices">${list.map((item) =>
        `<button type="button" class="choice" data-act="choose" data-group="${group}" data-id="${esc(item.id)}"><strong>${esc(item.title)}</strong></button>`
      ).join("")}</div>`;
    }

    function coverHtml() {
      return `
        ${art("lake")}
        <p class="kicker">一名新生走过的一百三十年</p>
        <h2>先把路走一遍</h2>
        <div class="prose">
          <p>2027年5月21日，浙江大学建校一百三十周年。你是新生。这条路不打分，只请你走一遍：先看见学校从哪里来，再为这四年选定一件要做的事。</p>
        </div>
        <label for="name">怎么称呼你</label>
        <input id="name" type="text" maxlength="12" autocomplete="name" placeholder="例如：俞丁悦" value="${esc(state.name)}">
        <div class="stack" style="margin-top:16px">
          <button type="button" class="primary" data-act="go" data-id="zijin">从紫金港出发</button>
        </div>
        ${footHtml()}`;
    }

    function askBlock(group, question, list, ack) {
      if (state.phase === "ack") {
        return `<div class="ack"><p>${ack}</p></div><div class="stack" style="margin-top:16px"><button type="button" class="primary" data-act="next">${group === "promise" ? "走向湖边" : "继续往前"}</button></div>`;
      }
      return `<p class="ask">${question}</p>${choiceButtons(group, list)}`;
    }

    function zijinHtml() {
      const ack = {
        road: "那就从1897年的书院门前走起。",
        steady: "日子要安顿，来路也要知道。我们先走到书院门前。",
        make: "也好。先看见前人怎样把事情做成，再决定你的四年。"
      }[state.attitude] || "";
      return `
        ${art("lake")}
        <p class="kicker">紫金港 · 2026年秋</p>
        <h2>报到</h2>
        <div class="prose">
          <p>你走进紫金港。行李还没放稳，启真湖就在旁边。学校的一百三十年，就摆在这条路上。</p>
        </div>
        ${askBlock("attitude", "你想先做哪一件？", [
          { id: "road", title: "把这所学校的来路问清楚" },
          { id: "steady", title: "先把自己的课和日子安顿好" },
          { id: "make", title: "我想知道，读书之外还能做成什么" }
        ], ack)}
        ${footHtml()}`;
    }

    function academyHtml() {
      const ack = {
        right: "你留下的是「只问是非，不计利害」。竺可桢后来解释求是，说过要只问是非、不计利害。",
        solid: "你留下的是做实。求是书院从开办起，就把讲求实学放在前面。",
        use: "你留下的是「学了要有用」。求是不能只停在纸面上，最后要落到做事上。"
      }[state.gate] || "";
      return `
        ${art("gate")}
        <p class="kicker">一八九七</p>
        <h2>书院门</h2>
        <div class="prose">
          <p>1897年5月21日，求是书院在杭州蒲场巷的普慈寺开学。浙江巡抚廖寿丰奏请设立，杭州知府林启任总办。书院以讲求实学为第一义，并逐渐形成务求实学、存是去非的学风。</p>
          <p>「求是」当时是书院的名字。1938年11月1日，竺可桢在广西宜山的开学典礼上，提出以这两个字为校训；同月19日，校务会议正式通过。今天的校训「求是创新」，是1988年5月5日确定的。</p>
        </div>
        ${askBlock("gate", "如果今天由你在门边留下一句，你留哪一句？", [
          { id: "right", title: "只问是非，不计利害" },
          { id: "solid", title: "把事情做实" },
          { id: "use", title: "学了要有用" }
        ], ack)}
        ${footHtml()}`;
    }

    function westHtml() {
      const ack = {
        tool: "你想守住的是仪器。历史上，图书和仪器随学校西迁，研究没有停下来。",
        people: "你想守住的是人。课能留下来，首先是因为师生还在一起。",
        light: "你想守住的是还能上课的光。学校每到一处，就重新把课开起来。"
      }[state.pack] || "";
      return `
        ${art("lamp")}
        <p class="kicker">一九三七—一九四六</p>
        <h2>把课留下</h2>
        <div class="prose">
          <p>1937年抗战爆发后，竺可桢校长率领师生西迁办学。学校经过浙江建德，江西吉安、泰和，广西宜山，1940年转到贵州遵义、湄潭、永兴。迁移的路上，课没有停。1946年秋，学校回到杭州。这段历程后来被称作「文军长征」。</p>
          <p>物理学家王淦昌关于验证中微子的实验方案，是在湄潭完成的。</p>
        </div>
        ${askBlock("pack", "行囊已经很重。如果还能再留住一件，你留什么？", [
          { id: "tool", title: "实验仪器" },
          { id: "people", title: "学生名册" },
          { id: "light", title: "今晚还能亮着的灯" }
        ], ack)}
        ${footHtml()}`;
    }

    function mergerHtml() {
      const done = Object.keys(state.matched).length === SCHOOLS.length;
      const schools = SCHOOLS.map((item) => {
        const ok = state.matched[item.id];
        const on = state.selectedSchool === item.id;
        const cls = ok ? "ok" : on ? "on" : "";
        const placeName = ok ? findPlace(ok).name : "";
        return `<button type="button" class="school ${cls}" data-act="school" data-id="${item.id}" ${ok ? "disabled" : ""}><strong>${esc(item.name)}</strong><span>${ok ? "已连上 " + esc(placeName) : esc(item.clue)}</span></button>`;
      }).join("");
      const places = state.placeOrder.map((id) => {
        const item = findPlace(id);
        const used = Object.values(state.matched).includes(id);
        const cls = used ? "ok" : "";
        return `<button type="button" class="place ${cls}" data-act="place" data-id="${item.id}" ${used ? "disabled" : ""}>${esc(item.name)}</button>`;
      }).join("");
      let note = done ? "" : (state.feedback || "先点一所学校，再点一个校园。");
      if (state.mistakes >= 2 && !done) {
        note += "提示：浙江大学在玉泉，杭州大学在西溪。园中有池的是华家池，靠近西湖东岸的是湖滨。";
      }
      const success = done ? `
        <div class="ack">
          <p>对上了。四校合并以后，校名仍是浙江大学。当时的校园有玉泉、西溪、华家池、湖滨和之江。你脚下的紫金港是后来建的，启真湖就在这里。</p>
          <ul class="pairs">
            <li>浙江大学 — 玉泉</li>
            <li>杭州大学 — 西溪</li>
            <li>浙江农业大学 — 华家池</li>
            <li>浙江医科大学 — 湖滨</li>
          </ul>
        </div>
        <div class="stack" style="margin-top:16px"><button type="button" class="primary" data-act="go" data-id="promise">走向自己的四年</button></div>` : "";
      return `
        ${art("doors")}
        <p class="kicker">一九五二—一九九八</p>
        <h2>一个名字</h2>
        <div class="prose">
          <p>1952年院系调整时，浙江大学的主体在杭州重组为若干所院校，后来发展为原浙江大学、杭州大学、浙江农业大学和浙江医科大学。四校同根同源。1998年9月15日，四校合并，新的浙江大学成立。</p>
        </div>
        <p class="ask">把四所学校和当时的主要校园连起来。</p>
        <div class="match"><div class="stack">${schools}</div><div class="stack">${places}</div></div>
        <p class="note ${state.mistakes >= 2 && !done ? "hint" : ""}" id="match-note">${note}</p>
        ${success}
        ${footHtml()}`;
    }

    function promiseHtml() {
      const tail = "求是走了一百三十年，靠的是有人把真问题做到底，也靠有人把所学用出去。你的四年，接在这条路上。";
      const ack = {
        read: `读明白，才讲得清。这是求是的基本功。${tail}`,
        make: `会读书之后，还要会动手。这一步，就是创造的起点。${tail}`,
        person: `学问落到具体的人身上，才算有了着落。${tail}`
      }[state.promise] || "";
      return `
        ${art("lake")}
        <p class="kicker">启真湖</p>
        <h2>你的四年</h2>
        <div class="prose">
          <p>来路先走到这里。书院的门、西迁的课、合并后的校名，都留在身后。前面四年，是你自己的。</p>
        </div>
        ${askBlock("promise", "这四年，你愿意先做哪一件？", [
          { id: "read", title: "把一门课读到能讲给别人听" },
          { id: "make", title: "为一个真实的问题动手做一次" },
          { id: "person", title: "把学到的东西用到具体的人身上" }
        ], ack)}
        ${footHtml()}`;
    }

    function wishHtml() {
      const count = charCount(state.wish.trim());
      const over = count > 40 || count === 0;
      return `
        ${art("lake")}
        <p class="kicker">二〇二七 · 五月二十一日</p>
        <h2>留一句</h2>
        <div class="prose">
          <p>2027年5月21日，浙江大学建校一百三十周年。把你想对学校说的一句，留在启真湖边。</p>
        </div>
        <label for="wish">湖边的一句</label>
        <textarea id="wish" maxlength="80">${esc(state.wish)}</textarea>
        <p class="count ${over ? "over" : ""}" id="wish-count">${count}/40${count > 40 ? "，请改到40字以内" : ""}</p>
        <button type="button" class="primary" id="go-card" data-act="finish" ${over ? "disabled" : ""}>生成我的求是路</button>
        ${footHtml()}`;
    }

    function labelOf(group, id) {
      const maps = {
        attitude: {
          road: "把这所学校的来路问清楚",
          steady: "先把自己的课和日子安顿好",
          make: "我想知道，读书之外还能做成什么"
        },
        gate: {
          right: "只问是非，不计利害",
          solid: "把事情做实",
          use: "学了要有用"
        },
        pack: {
          tool: "实验仪器",
          people: "学生名册",
          light: "今晚还能亮着的灯"
        },
        promise: {
          read: "把一门课读到能讲给别人听",
          make: "为一个真实的问题动手做一次",
          person: "把学到的东西用到具体的人身上"
        }
      };
      return (maps[group] && maps[group][id]) || "";
    }

    function cardHtml() {
      return `
        <article class="card" id="result-card">
          <p class="kicker">1897—2027</p>
          <h2>我的求是路</h2>
          <p class="who">${esc(displayName())}</p>
          <dl>
            <dt>出发时</dt><dd>${esc(labelOf("attitude", state.attitude))}</dd>
            <dt>书院门边</dt><dd>${esc(labelOf("gate", state.gate))}</dd>
            <dt>西迁行囊</dt><dd>${esc(labelOf("pack", state.pack))}</dd>
            <dt>四年之约</dt><dd>${esc(labelOf("promise", state.promise))}</dd>
            <dt>湖边的一句</dt><dd>${esc(state.wish.trim())}</dd>
          </dl>
          <p class="seal">浙江大学建校一百三十周年</p>
        </article>
        <div class="stack" style="margin-top:16px">
          <button type="button" class="primary" data-act="download">下载这张卡片</button>
          <button type="button" class="ghost" data-act="copy">复制分享文字</button>
          <button type="button" class="ghost" data-act="restart">再走一次</button>
        </div>
        <p class="note" id="copy-note"></p>
        ${footHtml()}`;
    }

    function aboutHtml() {
      return `
        <p class="kicker">提交前请读完</p>
        <h2>创作说明</h2>
        <div class="prose">
          <p>作品名称：求是路。类别：创意类，网页游戏。作者：俞丁悦。</p>
          <p>选题对应三项主题：探寻校史荣光，传承求是精神；启航求是新程，谱写青春之声；从「会读书」到「会创造」。玩家以新生身份走过校史，再为这四年选定一件要做的事。</p>
          <p>玩家的选择是个人回应，不改写史实。史实写在每一幕的叙述里。</p>
          <p>人工智能使用说明：使用场景是网页游戏的文案、界面和交互代码；生成工具是 Cursor 中的 Grok。游戏初稿由人工智能生成，占代码和正文的绝大部分。作者确定了作品主题、游戏形式和署名，并要求按学校公开记载核对校史、修改中文表达。作者提交前应再通读一遍定稿。</p>
          <p>史实依据学校公开记载，主要包括这些内容。1897年5月21日，求是书院在杭州蒲场巷普慈寺开学。浙江巡抚廖寿丰奏请设立，杭州知府林启任总办。1937年后学校西迁，经过浙江建德，江西吉安、泰和，广西宜山，1940年转到贵州遵义、湄潭、永兴，1946年秋回到杭州。这段历程后来被称作「文军长征」。1938年11月1日，竺可桢在宜山提出以「求是」为校训，同月19日校务会议通过。1988年5月5日，校训确定为「求是创新」。1952年院系调整后，学校主体后来发展为四所同根同源的大学，1998年9月15日重新合并。玉泉、西溪、华家池、湖滨分别对应四所学校当时的主要校园，之江也是合并时的校区。紫金港是后来新建的校区。王淦昌关于验证中微子的实验方案，是在湄潭完成的。2027年5月21日为建校一百三十周年。</p>
          <p>原创说明：画面用代码绘制，没有使用校徽、校歌全文和他人摄影。玩家填写的姓名和祝福，属于玩家本人。学号、班级和任课教师，由作者在提交给任课教师时另行写明。</p>
        </div>
        <div class="stack">
          <button type="button" class="primary" data-act="back">返回</button>
        </div>
        ${footHtml()}`;
    }

    function render() {
      const body = {
        cover: coverHtml,
        zijin: zijinHtml,
        academy: academyHtml,
        west: westHtml,
        merger: mergerHtml,
        promise: promiseHtml,
        wish: wishHtml,
        card: cardHtml,
        about: aboutHtml
      }[state.scene];
      app.innerHTML = `${stepsHtml()}<section class="scene">${body()}</section>`;
      if (state.scene === "cover") {
        const input = document.getElementById("name");
        if (input) input.focus();
      }
      if (state.scene === "wish") {
        const box = document.getElementById("wish");
        if (box) {
          const end = box.value.length;
          box.setSelectionRange(end, end);
          box.focus();
        }
      }
    }

    function go(scene) {
      if (scene === "merger" && state.placeOrder.length === 0) {
        state.placeOrder = shuffle(PLACES.map((item) => item.id));
        state.matched = {};
        state.selectedSchool = "";
        state.mistakes = 0;
      }
      state.phase = "ask";
      state.scene = scene;
      render();
      window.scrollTo(0, 0);
    }

    function shuffle(list) {
      const arr = list.slice();
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function nextAfter(group) {
      const map = { attitude: "academy", gate: "west", pack: "merger", promise: "wish" };
      go(map[group]);
    }

    function choose(group, id) {
      state[group] = id;
      state.phase = "ack";
      render();
    }

    function pickSchool(id) {
      if (state.matched[id]) return;
      state.selectedSchool = id;
      state.feedback = `已选${findSchool(id).name}，再点一个校园。`;
      render();
    }

    function pickPlace(placeId) {
      if (Object.values(state.matched).includes(placeId)) return;
      if (!state.selectedSchool) {
        state.feedback = "先点一所学校，再点一个校园。";
        render();
        return;
      }
      const school = findSchool(state.selectedSchool);
      if (school.place === placeId) {
        state.matched[state.selectedSchool] = placeId;
        state.selectedSchool = "";
        state.feedback = `${school.name}对应${findPlace(placeId).name}。`;
      } else {
        state.mistakes += 1;
        state.selectedSchool = "";
        state.feedback = "这一对不对，再试一次。";
      }
      render();
    }

    function backStep() {
      const order = ["cover", "zijin", "academy", "west", "merger", "promise", "wish"];
      const index = order.indexOf(state.scene);
      if (index <= 0) return;
      state.phase = "ask";
      state.scene = order[index - 1];
      render();
      window.scrollTo(0, 0);
    }

    function shareText() {
      const link = location.href.split("#")[0];
      return `我走完了网页游戏《求是路》。它用一名新生的视角，走过浙江大学一百三十年：求是书院、西迁办学、四校合并，再到自己的四年。2027年5月21日是建校一百三十周年。\n${link}`;
    }

    function wrapText(ctx, text, maxWidth) {
      const chars = Array.from(text);
      const lines = [];
      let line = "";
      chars.forEach((ch) => {
        const test = line + ch;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      });
      if (line) lines.push(line);
      return lines;
    }

    function downloadCard() {
      const width = 1080;
      const height = 1620;
      const scale = 2;
      const canvas = document.createElement("canvas");
      canvas.width = width * scale;
      canvas.height = height * scale;
      const ctx = canvas.getContext("2d");
      ctx.scale(scale, scale);
      ctx.fillStyle = "#f3efe6";
      ctx.fillRect(0, 0, width, height);
      ctx.strokeStyle = "#0b3a75";
      ctx.lineWidth = 4;
      ctx.strokeRect(48, 48, width - 96, height - 96);
      ctx.fillStyle = "#0b3a75";
      ctx.font = '64px "Songti SC", "SimSun", "Microsoft YaHei", serif';
      ctx.fillText("求是路", 96, 180);
      ctx.fillStyle = "#8a6232";
      ctx.font = '32px "Microsoft YaHei", sans-serif';
      ctx.fillText("1897—2027", 96, 240);
      ctx.fillStyle = "#1b1916";
      ctx.font = '42px "Microsoft YaHei", sans-serif';
      ctx.fillText(displayName(), 96, 340);
      const rows = [
        ["出发时", labelOf("attitude", state.attitude)],
        ["书院门边", labelOf("gate", state.gate)],
        ["西迁行囊", labelOf("pack", state.pack)],
        ["四年之约", labelOf("promise", state.promise)],
        ["湖边的一句", state.wish.trim()]
      ];
      let y = 430;
      rows.forEach(([label, value]) => {
        ctx.fillStyle = "#8a6232";
        ctx.font = '28px "Microsoft YaHei", sans-serif';
        ctx.fillText(label, 96, y);
        y += 48;
        ctx.fillStyle = "#1b1916";
        ctx.font = '36px "Microsoft YaHei", sans-serif';
        wrapText(ctx, value, 860).forEach((line) => {
          ctx.fillText(line, 96, y);
          y += 52;
        });
        y += 28;
      });
      ctx.fillStyle = "#0b3a75";
      ctx.font = '32px "Microsoft YaHei", sans-serif';
      ctx.fillText("浙江大学建校一百三十周年", 96, 1480);
      const link = document.createElement("a");
      link.href = canvas.toDataURL("image/png");
      link.download = `求是路-${displayName()}.png`;
      link.click();
    }

    async function copyShare() {
      const note = document.getElementById("copy-note");
      const text = shareText();
      try {
        await navigator.clipboard.writeText(text);
        if (note) note.textContent = "分享文字已复制，可以贴到小红书。";
      } catch (error) {
        if (note) note.textContent = text;
      }
    }

    function restart() {
      state.scene = "cover";
      state.attitude = "";
      state.gate = "";
      state.pack = "";
      state.promise = "";
      state.wish = DEFAULT_WISH;
      state.selectedSchool = "";
      state.matched = {};
      state.placeOrder = [];
      state.mistakes = 0;
      state.feedback = "";
      state.phase = "ask";
      render();
      window.scrollTo(0, 0);
    }

    app.addEventListener("click", (event) => {
      const el = event.target.closest("[data-act]");
      if (!el || el.disabled) return;
      const act = el.dataset.act;
      const id = el.dataset.id || "";
      if (act === "go") {
        if (state.scene === "cover") {
          const input = document.getElementById("name");
          state.name = input ? input.value : state.name;
        }
        go(id);
        return;
      }
      if (act === "choose") {
        choose(el.dataset.group, id);
        return;
      }
      if (act === "next") {
        const group = state.scene === "zijin" ? "attitude" : state.scene === "academy" ? "gate" : state.scene === "west" ? "pack" : "promise";
        nextAfter(group);
        return;
      }
      if (act === "school") {
        pickSchool(id);
        return;
      }
      if (act === "place") {
        pickPlace(id);
        return;
      }
      if (act === "finish") {
        const box = document.getElementById("wish");
        state.wish = box ? box.value.trim() : state.wish.trim();
        if (charCount(state.wish) === 0 || charCount(state.wish) > 40) return;
        go("card");
        return;
      }
      if (act === "download") {
        downloadCard();
        return;
      }
      if (act === "copy") {
        copyShare();
        return;
      }
      if (act === "restart") {
        restart();
        return;
      }
      if (act === "back-step") {
        backStep();
        return;
      }
      if (act === "about") {
        state.returnTo = state.scene === "about" ? state.returnTo : state.scene;
        state.scene = "about";
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (act === "back") {
        state.scene = state.returnTo || "cover";
        render();
        window.scrollTo(0, 0);
      }
    });

    app.addEventListener("input", (event) => {
      if (event.target.id === "name") state.name = event.target.value;
      if (event.target.id === "wish") {
        state.wish = event.target.value;
        const count = charCount(state.wish.trim());
        const node = document.getElementById("wish-count");
        const button = document.getElementById("go-card");
        const over = count > 40 || count === 0;
        if (node) {
          node.textContent = `${count}/40${count > 40 ? "，请改到40字以内" : ""}`;
          node.classList.toggle("over", over);
        }
        if (button) button.disabled = over;
      }
    });

    render();
  </script>
</body>
</html>
